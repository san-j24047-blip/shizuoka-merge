<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しずおか ゆるキャラ合体ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>しずおか ゆるキャラ合体ゲーム</h1>
      <p>同じキャラをぶつけて合体させよう！</p>
    </header>

    <section class="status">
      <div>スコア <strong id="score">0</strong></div>
      <div>次のキャラ <span id="next-character">🐻</span></div>
    </section>

    <div class="game-wrap">
      <canvas id="game" width="420" height="600"></canvas>
      <div id="game-over" class="game-over hidden">
        <h2>ゲームオーバー！</h2>
        <p>スコア：<span id="final-score">0</span></p>
        <button id="restart">もう一度遊ぶ</button>
      </div>
    </div>

    <p class="help">
      マウスや指で落とす位置を決め、クリック・タップで落とそう。
    </p>

    <section class="evolution">
      <h2>キャラクター進化表</h2>
      <div id="evolution-list"></div>
    </section>
  </main>

  <!-- Matter.js：物理演算ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

  <!-- キャラ設定を先に読み込む -->
  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
