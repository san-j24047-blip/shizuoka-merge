<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静岡県スイカゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- スタート画面 -->
  <section id="menu-screen" class="screen menu-screen">
    <div class="menu-panel">
      <p class="menu-subtitle">SHIZUOKA PREFECTURE</p>
      <h1>静岡県スイカゲーム</h1>
      <p class="menu-description">
        静岡の名物を育てて、目指せ富士山！
      </p>

      <div class="menu-buttons">
        <button id="start-button" class="menu-button start-button">
          ゲームスタート
        </button>

        <button id="ranking-button" class="menu-button ranking-button">
          ランキング
        </button>
      </div>
    </div>
  </section>

  <!-- ランキング画面（現時点では仮表示） -->
  <section id="ranking-screen" class="screen ranking-screen" hidden>
    <div class="menu-panel">

      <h2>ランキング</h2>
      <p>オンラインランキング TOP 10</p>

      <div id="ranking-list">
        <p class="ranking-placeholder">ランキングを読み込み中...</p>
      </div>

      <button id="back-button" class="menu-button ranking-button">
        メニューに戻る
      </button>
    </div>
  </section>
  <section id="game-screen" class="screen" hidden>
    <main class="game-container">
      <h1>静岡県スイカゲーム</h1>
      <p>同じキャラをくっつけて進化させよう！</p>

      <div class="game-layout">
        <section class="evolution-area">
          <h2>進化一覧</h2>
          <div id="evolution-list"></div>
        </section>

        <section class="game-area">
          <canvas id="game-canvas" width="500" height="700">
            お使いのブラウザはCanvasに対応していません。
          </canvas>


        <div id="game-over" class="game-over hidden">
          <h2>ゲームオーバー</h2>
          <p>最終スコア：<span id="final-score">0</span></p>

          <div id="score-registration">
            <p>ランキングに登録しますか？</p>
            <button id="register-score-button">登録する</button>
            <button id="skip-registration-button">登録しない</button>
          </div>

          <div id="score-registration-form" hidden>
            <label for="score-player-name">
              プレイヤー名（1〜12文字）
            </label>
            <input type="text" id="score-player-name" maxlength="12" placeholder="名前を入力">
            <button id="submit-score-button">ランキングに登録</button>
            <p id="score-registration-message"></p>
            <button id="cancel-registration-button">戻る</button>
          </div>

          <button id="restart-button">もう一度遊ぶ</button>
          <button id="return-menu-button" class="return-menu-button">メインメニューへ</button>
        </div>
        </section>

        <aside class="game-sidebar">
          <section class="game-info">
            <div class="score-area">
              <span>スコア</span>
              <span id="score">0</span>
            </div>
            <div class="next-area">
              <span>つぎのキャラ</span>
              <div id="next-character">準備中</div>
            </div>
          </section>
        </aside>
      </div>
    </main>
  </section>

  <!-- 物理演算ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="characters.js"></script>
  <script src="menu.js"></script>
  <script src="supabase.js"></script>
  <script src="shape.js"></script>
  <script src="physics.js"></script>
  <script src="game.js"></script>

  <!-- 進化一覧の表示 -->
  <script>
    const evolutionList = document.getElementById("evolution-list");

    characters.forEach((character) => {
      const item = document.createElement("div");
      item.className = "evolution-item";

      const stage = document.createElement("div");
      stage.className = "evolution-stage";
      stage.textContent = `第${character.stage}段階`;

      const image = document.createElement("img");
      image.className = "evolution-image";
      image.src = character.image;
      image.alt = character.motif;
      image.onerror = () => {
        image.style.display = "none";
      };

      const name = document.createElement("div");
      name.className = "evolution-name";
      name.textContent = character.name;

      const motif = document.createElement("div");
      motif.className = "evolution-motif";
      motif.textContent = character.motif;

      item.append(stage, image, name, motif);
      const angle = (2 * Math.PI * (character.stage - 1)) / characters.length - Math.PI / 2;
      item.style.left = `${50 + 39 * Math.cos(angle)}%`;
      item.style.top = `${50 + 39 * Math.sin(angle)}%`;
      evolutionList.appendChild(item);
    });
  </script>

</body>

</html>
